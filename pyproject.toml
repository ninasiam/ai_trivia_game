[project]
name = "trivia-game-app"
version = "0.1.0"
description = "Slumdog Pythonair! An AI powered trivia game!"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.11.7",
  "pydantic-settings>=2.11.0",
  "requests>=2.32.5",
  "typing-extensions>=4.15.0",
  "langchain>=1.2.13",
  "langchain-core>=1.2.22",
  "langchain-ollama>=0.3.10",
  "langchain-google-genai>=4.2.1",
  "langgraph>=1.1.3",
  "fastapi>=0.120.1",
  "uvicorn>=0.38.0",
  "chainlit>=2.10.0",
  "black>=26.5.1",
]
[tool.mypy]
ignore_missing_imports = true
